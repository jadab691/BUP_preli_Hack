services:
  - type: web
    name: gridwise
    runtime: docker
    repo: https://github.com/YOUR_USER/YOUR_REPO
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: LLM_MODEL
        value: gemini-3.5-flash
      - key: LLM_TIMEOUT_S
        value: "30"
      - key: LLM_API_KEY
        sync: false